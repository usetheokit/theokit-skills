name: sdk-drift

# THE COUPLING THESE SKILLS LOST, REBUILT AS A SCHEDULE.
#
# They used to be authored inside `@theokit/sdk`, so a pull request removing an export touched them
# in the same diff and that repo's gate fired. They live here now and that is gone: the SDK can
# delete a symbol tomorrow and nothing in this repository would notice until a user followed a skill
# that lies.
#
# So the check runs on a clock against whatever `@theokit/sdk` is CURRENTLY published — not the
# version in the lockfile, which is exactly the version that cannot tell you anything new. A failure
# here means the published API moved out from under a skill, and it opens an issue rather than
# turning a Slack notification nobody reads into the whole alerting story.

on:
  schedule:
    # 06:00 UTC daily. A published API change is worth catching in a day; a week is long enough for
    # someone to have followed the stale instruction and filed a bug against the wrong thing.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: skills vs the published SDK
    runs-on: ubuntu-latest
    # F-arch-4 (/review of B-004): the package list appeared three times, and the acceptance
    # criteria greped only the install lines. A drifted copy in the reporting step would print
    # `7/7` while five were installed — a gate claiming coverage it does not have, which is the
    # invariant `agents/theokit-skills.md` § 4 forbids and which this job exists to enforce.
    # One definition, referenced by both the install and the report.
    env:
      #
      # NAMES, not `name@latest`. The install step below resolves each one to a concrete version at
      # run time and installs that. The job still tests what is published TODAY — resolution happens
      # against the live registry on every run — but the install line carries no mutable tag, so the
      # exact versions are printed, land in the drift issue, and can be re-installed to reproduce a
      # failure. Today's issue says "the SDK moved" without saying what it moved to.
      TAUGHT_PACKAGES: >-
        @theokit/sdk @theokit/di @theokit/di-agent @theokit/sdk-tools @theokit/gateway-discord @theokit/gateway-slack @theokit/gateway-telegram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, and the issue it opens authenticates through GH_TOKEN.
          # Leaving the checkout credential in `.git/config` would be a token nothing needs.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install against the latest published @theokit/sdk # zizmor: ignore[adhoc-packages]
        id: install
        run: |
          set -euo pipefail
          # Resolving against the live registry at run time IS the check: this job asks whether the
          # skills still resolve against what the packages publish TODAY. Committing a lockfile
          # would pin the very thing being tested, and the job would pass forever while the skills
          # drifted.
          #
          # What IS pinned is the install: each name is resolved to a concrete version first, and
          # those versions are installed, printed, and carried into the drift issue. Resolution
          # stays live; the install stops being a mutable tag, so a failure can be reproduced by
          # re-installing exactly what this run had. (SonarQube githubactions:S8543.)
          #
          # shellcheck disable=SC2086  # word splitting is intended: TAUGHT_PACKAGES is a name list
          RESOLVED=""
          for pkg in $TAUGHT_PACKAGES; do
            RESOLVED="$RESOLVED $pkg@$(npm view "$pkg" version)"
          done
          # typescript is the COMPILER, not a package under test, and it is the one thing here that
          # must NOT float. Pinning it to `npm view typescript version` broke this job on the first
          # run that tried it: that resolves to 7.x — the native port, whose JS API no longer has
          # `ts.ScriptTarget` — and `tests/api-resolves.test.mjs` drives `ts.createProgram` directly.
          # It comes from the lockfile, which is where the version this suite is written against
          # already lives.
          RESOLVED="$RESOLVED typescript@$(node -p "require('./package-lock.json').packages['node_modules/typescript'].version")"
          echo "resolved:$RESOLVED"

          # --ignore-scripts: this job installs seven packages into a runner that holds
          # `issues: write`. A lifecycle script in any of them — or in anything they pull — would
          # run with that token. Measured before adding it: zero packages in the resolved tree
          # declare preinstall/install/postinstall, so it costs nothing here.
          # (SonarQube githubactions:S6505.)
          #
          # shellcheck disable=SC2086  # word splitting is intended: RESOLVED is a package list
          npm install --no-save --ignore-scripts $RESOLVED # zizmor: ignore[adhoc-packages]
          echo "sdk=$(node -p "require('./node_modules/@theokit/sdk/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Resolve every symbol the skills teach
        id: check
        run: npm test

      - name: Report taught-surface-coverage
        # F-arch-2 (/review of B-004): this step used to sit BEFORE `check`. A crash in it failed
        # the job, and the issue step never fired — its `if` reads `steps.check.outcome == 'failure'`,
        # which is unset when `check` never ran. So a bug in the REPORT would have silenced the
        # ALERT. ADR-2 of that plan says this step must not fail the job; `continue-on-error` plus
        # `always()` is what makes that true rather than intended.
        #
        # F-tw-1 / F-tw-10 (same review): it compares against `node_modules`, never against the
        # declared env string — the first version printed 7/7 with a bogus package in the list, and
        # then printed 7/7 over an empty node_modules after a failed install. The count is observed.
        #
        # B-010: the body used to be an inline `node -e`, which meant nothing could test it AND it
        # carried its own import extractor — a third one, after B-008 unified the two in `tests/`.
        # It is a file now: `scripts/taught-coverage.mjs`, covered by `tests/taught-coverage.test.mjs`.
        if: always()
        continue-on-error: true
        run: node scripts/taught-coverage.mjs

      - name: Fail on a bookkeeping mismatch
        # The step above reports and can never fail; this one exists only to fail. Two steps rather
        # than one because ADR-2 above is still in force: a report that can fail is a report that
        # can silence an alert.
        #
        # `steps.install.outcome == 'success'` and not `always()`: asserting over an empty
        # node_modules would report a bookkeeping mismatch that is really an install failure —
        # F-tw-10, one step over.
        #
        # stdout is discarded because the step above already printed it; the mismatch diagnosis goes
        # to stderr and still shows. The drift-issue step keys on `steps.check.outcome`, so failing
        # here can never open a drift issue — which is what keeps "someone forgot to update
        # TAUGHT_PACKAGES" distinguishable from "a package removed an export".
        if: steps.install.outcome == 'success'
        run: node scripts/taught-coverage.mjs > /dev/null

      - name: Open an issue when a skill teaches an API the package no longer has
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SDK: ${{ steps.install.outputs.sdk }}
          # The resolved versions, so the reproduce command in the issue re-installs exactly what
          # this run installed rather than whatever is newest when someone reads it.
          PKGS: ${{ steps.install.outputs.resolved }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # F-dom-7 (/review of B-004): the title used to hardcode `@theokit/sdk@${SDK}`, so drift
          # in a gateway adapter filed an issue naming the SDK and stamping the SDK's version. It
          # is also the DEDUP KEY, so a gateway drifting while an SDK-titled issue was open would
          # have been swallowed by the search below — the alert lost, not merely mislabelled.
          #
          # The title now names the run's date instead of one package. Which package drifted is in
          # the body, where the compiler output says it, rather than guessed by a workflow that
          # cannot know before `npm test` runs.
          title="skills drifted from a published @theokit package ($(date -u +%F))"
          # One open issue at a time: a daily job that files a duplicate every morning trains people
          # to close them unread, which is worse than not filing at all. Dedup is now per-day, so a
          # second package drifting on the same day joins the same issue rather than vanishing.
          open_count="$(gh issue list --state open --search "$title in:title" --json number --jq 'length')"
          if [ "$open_count" != "0" ]; then
            echo "an open issue already tracks this"
            exit 0
          fi
          # A quoted heredoc, not a printf chain: the body contains backticks, and shellcheck reads
          # a backtick inside single quotes as command substitution (SC2016). Quoting the delimiter
          # also stops the shell expanding anything in the body, so the two values are substituted
          # explicitly below and nothing else can be.
          cat > issue-body.template <<'BODY'
          The scheduled drift check failed. It installs every `@theokit` package the skills teach at
          `@latest`, so the drift may be in ANY of them — read the compiler output in the run log
          for the package and symbol. `@theokit/sdk` resolved to `__SDK__` on this run; the
          `taught-surface-coverage` step lists every package with the version it resolved to.

          A skill here teaches a symbol or subpath the published SDK does not export. That is not a
          stale doc: an agent follows it and writes code that does not compile, with the confidence
          of something it was told.

          Reproduce locally:

          ```bash
          npm install --no-save --ignore-scripts __PKGS__
          npm test
          ```

          Workflow run: __RUN_URL__
          BODY
          sed -e "s|__SDK__|${SDK}|g" -e "s|__RUN_URL__|${RUN_URL}|g" -e "s|__PKGS__|${PKGS}|g" issue-body.template \
            | sed 's/^          //' > issue-body.md
          gh issue create --title "$title" --body-file issue-body.md

name: sdk-drift

# THE COUPLING THESE SKILLS LOST, REBUILT AS A SCHEDULE.
#
# They used to be authored inside `@theokit/sdk`, so a pull request removing an export touched them
# in the same diff and that repo's gate fired. They live here now and that is gone: the SDK can
# delete a symbol tomorrow and nothing in this repository would notice until a user followed a skill
# that lies.
#
# So the check runs on a clock against whatever `@theokit/sdk` is CURRENTLY published — not the
# version in the lockfile, which is exactly the version that cannot tell you anything new. A failure
# here means the published API moved out from under a skill, and it opens an issue rather than
# turning a Slack notification nobody reads into the whole alerting story.

on:
  schedule:
    # 06:00 UTC daily. A published API change is worth catching in a day; a week is long enough for
    # someone to have followed the stale instruction and filed a bug against the wrong thing.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: skills vs the published SDK
    runs-on: ubuntu-latest
    # F-arch-4 (/review of B-004): the package list appeared three times, and the acceptance
    # criteria greped only the install lines. A drifted copy in the reporting step would print
    # `7/7` while five were installed — a gate claiming coverage it does not have, which is the
    # invariant `agents/theokit-skills.md` § 4 forbids and which this job exists to enforce.
    # One definition, referenced by both the install and the report.
    env:
      TAUGHT_PACKAGES: >-
        @theokit/sdk@latest @theokit/di@latest @theokit/di-agent@latest @theokit/sdk-tools@latest @theokit/gateway-discord@latest @theokit/gateway-slack@latest @theokit/gateway-telegram@latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, and the issue it opens authenticates through GH_TOKEN.
          # Leaving the checkout credential in `.git/config` would be a token nothing needs.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install against the latest published @theokit/sdk # zizmor: ignore[adhoc-packages]
        id: install
        run: |
          set -euo pipefail
          # Installing @latest at runtime IS the check: this job asks whether the skills still
          # resolve against whatever the SDK publishes today. A lockfile would pin the very thing
          # being tested, and the job would pass forever while the skills drifted.
          # shellcheck disable=SC2086  # word splitting is intended: TAUGHT_PACKAGES is a package list
          npm install --no-save $TAUGHT_PACKAGES typescript # zizmor: ignore[adhoc-packages]
          echo "sdk=$(node -p "require('./node_modules/@theokit/sdk/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve every symbol the skills teach
        id: check
        run: npm test

      - name: Report taught-surface-coverage
        # F-arch-2 (/review of B-004): this step used to sit BEFORE `check`. A crash in the node
        # script failed the job, and the issue step never fired — its `if` reads
        # `steps.check.outcome == 'failure'`, which is unset when `check` never ran. So a bug in
        # the REPORT would have silenced the ALERT. ADR-2 says this step must not fail the job;
        # `continue-on-error` plus `always()` is what makes that true rather than intended.
        #
        # F-tw-1 (/review of B-004): the first version compared the taught set against the
        # INSTALLED env STRING, so it reported what the workflow DECLARED rather than what the
        # install achieved. Proved by the reviewer: adding `@theokit/does-not-exist@latest` to that
        # string still printed 7/7. That is a gate claiming coverage it does not have — the exact
        # invariant `agents/theokit-skills.md` § 4 forbids and this job exists to enforce.
        #
        # F-tw-10: and because `always()` now runs it after a failed install, the declared version
        # would have printed 7/7 over an empty node_modules.
        #
        # It reads `node_modules` instead. The number is observed, and a failed install shows as a
        # low count rather than a confident one.
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs"),path=require("path");
            const taught=new Set();
            for(const d of fs.readdirSync("skills")){
              const f=path.join("skills",d,"SKILL.md"); if(!fs.existsSync(f))continue;
              for(const m of fs.readFileSync(f,"utf8").matchAll(/from\s*["\x27](@theokit\/[^"\x27]+)["\x27]/g))
                taught.add(m[1].split("/").slice(0,2).join("/"));
            }
            const onDisk=new Map();
            for(const name of [...taught]){
              const mf=path.join("node_modules",...name.split("/"),"package.json");
              if(fs.existsSync(mf)) onDisk.set(name, JSON.parse(fs.readFileSync(mf,"utf8")).version);
            }
            const missing=[...taught].filter(p=>!onDisk.has(p)).sort();
            console.log(`taught-surface-coverage: ${onDisk.size}/${taught.size} taught packages present in node_modules`);
            for(const [n,v] of [...onDisk].sort()) console.log(`  ${n}@${v}`);
            if(missing.length) console.log(`  MISSING from node_modules: ${missing.join(", ")}`);
          '

      - name: Open an issue when a skill teaches an API the package no longer has
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SDK: ${{ steps.install.outputs.sdk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="skills drifted from @theokit/sdk@${SDK}"
          # One open issue at a time: a daily job that files a duplicate every morning trains people
          # to close them unread, which is worse than not filing at all.
          open_count="$(gh issue list --state open --search "$title in:title" --json number --jq 'length')"
          if [ "$open_count" != "0" ]; then
            echo "an open issue already tracks this"
            exit 0
          fi
          # A quoted heredoc, not a printf chain: the body contains backticks, and shellcheck reads
          # a backtick inside single quotes as command substitution (SC2016). Quoting the delimiter
          # also stops the shell expanding anything in the body, so the two values are substituted
          # explicitly below and nothing else can be.
          cat > issue-body.template <<'BODY'
          The scheduled drift check failed against `@theokit/sdk@__SDK__`.

          A skill here teaches a symbol or subpath the published SDK does not export. That is not a
          stale doc: an agent follows it and writes code that does not compile, with the confidence
          of something it was told.

          Reproduce locally:

          ```bash
          npm install --no-save __PKGS__ typescript
          npm test
          ```

          Workflow run: __RUN_URL__
          BODY
          sed -e "s|__SDK__|${SDK}|g" -e "s|__RUN_URL__|${RUN_URL}|g" -e "s|__PKGS__|${TAUGHT_PACKAGES}|g" issue-body.template \
            | sed 's/^          //' > issue-body.md
          gh issue create --title "$title" --body-file issue-body.md

name: ci

on:
  # Work is born on `workspace` and promoted through `develop` to `main`, so a gate that only runs
  # on `main` reports on code that was merged before anyone could see the result. The three-platform
  # matrix below is worth nothing if it first executes after the decision to merge.
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  test:
    # THREE PLATFORMS, DELIBERATELY. This package creates links, and linking is the one thing that
    # behaves differently on each: Windows needs a junction (a symlink there requires Administrator
    # or Developer Mode), elsewhere a relative symlink is correct. The installer falls back to
    # copying when a link is refused — and a fallback nobody exercises is a fallback nobody has
    # seen work. `windows-latest` is what turns "should work on Windows" into a measurement.
    name: test + install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # The suite needs devDependencies now. `api-resolves.test.mjs` compiles every documented
      # import against the PUBLISHED `@theokit/sdk` in `node_modules`, so without an install it
      # fails closed with "no installed @theokit package has built declarations" — the gate
      # working, and how this step's old "no dependencies" comment stopped being true.
      # `dependencies` stays empty, which is what keeps `npx @theokit/skills` instant.
      - name: Install devDependencies
        run: npm install --no-audit --no-fund
      - name: Run the suite
        run: npm test
      - name: The installer refuses an empty corpus instead of reporting success over nothing
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          # The installer writes into the CWD, so run it from the scratch dir: a smoke test that
          # dirties the repository it is testing would fail the cleanliness check below for its
          # own reason rather than the code's.
          cd "$scratch"
          # skills/ is empty while the corpus is regenerated from theokit-examples, so this job
          # cannot assert that a skill landed. It asserts the property that matters more while
          # that is true: "installed" over zero skills is the worst output the installer could
          # give, because the agent simply finds no skill and nothing says why. Restore the
          # landed-skill assertions when the corpus returns.
          if node "$GITHUB_WORKSPACE/bin/install.mjs" --target=agents --target=claude; then
            echo "the installer exited 0 with an empty corpus" >&2
            exit 1
          fi
          test -z "$(ls -A)"
      - name: The repo must be clean afterwards
        shell: bash
        run: git diff --exit-code && git status --porcelain
      # The published-manifest contract, checked instead of remembered. Audited across 50
      # packages on 2026-09-01: 38 did not export "./package.json" — reproduced as
      # `ERR_PACKAGE_PATH_NOT_EXPORTED` against a real tarball — 30 had no keywords and 18
      # declared no sideEffects at all.
      #
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
      # caller without nine pull requests, which is the reason that repo exists.
      - name: Published manifests satisfy the contract
        uses: usetheokit/shared-workflows/actions/manifest-check@v1 # zizmor: ignore[unpinned-uses]

  # SonarQube Cloud, from CI rather than Automatic Analysis.
  #
  # Automatic Analysis does not import coverage — "code coverage information is not supported" in
  # its own documentation — so on that mechanism this project reported bugs and smells while the
  # quality gate stayed blind to how much of the code the suite reaches.
  #
  # Automatic Analysis must be OFF for this project or the scanner refuses to run:
  # "You are running CI analysis while Automatic Analysis is enabled." Switched off 2026-09-01;
  # it is a UI toggle, the settings API refuses it with `cannot be set on a Project`.
  #
  # The coverage number comes from node's own runner (`--experimental-test-coverage` with the lcov
  # reporter), not from a second framework added for the scan. Measured before wiring: 98.35% lines
  # over `bin/` and `lib/`, with `coverage/lcov.info` present at the path
  # `sonar-project.properties` names.
  #
  # One platform, not the three the suite runs on. The matrix exists because linking behaves
  # differently per OS; a static analysis of the same source three times would report the same
  # findings three times and race for one server-side report.
  sonar:
    needs: test
    # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
    # caller without eleven pull requests, which is the reason that repository exists.
    uses: usetheokit/shared-workflows/.github/workflows/sonar.yml@v1 # zizmor: ignore[unpinned-uses]
    # Named rather than inherited: `secrets: inherit` would hand the scanner every secret
    # this repository holds.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      coverage-command: npm run test:coverage

  # ONE required check for this whole workflow.
  #
  # Branch protection requires checks BY NAME, so every job added here is advisory
  # until somebody edits the required list in the repository settings by hand.
  # Measured across the ecosystem on 2026-09-01, that list had drifted everywhere —
  # `release channel`, which stops a stable publish moving the `latest` dist-tag for
  # every consumer, was required in ZERO repositories the week it was written.
  #
  # This job is what the branch requires. A job added to `needs` below is gated the
  # moment it is listed; a job NOT listed is not, which is the one thing to check
  # when adding one.
  ci-ok:
    name: CI
    if: always()
    needs:
      - test
      - sonar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach
      # every caller without nine pull requests, which is the reason that repo exists.
      - uses: usetheokit/shared-workflows/actions/checks-pass@v1 # zizmor: ignore[unpinned-uses]
        with:
          needs: ${{ toJSON(needs) }}

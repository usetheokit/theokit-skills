name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drift-gate:
    name: skill drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependencies: the drift gate uses Node's built-in test runner.
      - name: Run drift gate (SKILL.md + references/*.md)
        run: node --test tests/

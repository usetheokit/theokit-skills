name: sync-sdk-references

# Keep references/ in step with the latest @theokit/sdk scaffold.
# Runs weekly (+ on demand). If the synced references changed, it opens a PR;
# the ci.yml drift gate then validates that PR (and fails if a NEW module needs
# a SKILL.md link — the one thing a human must add).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only the SDK's shipped claude-template markdown is needed — skip its
      # native postinstall (better-sqlite3) with --ignore-scripts.
      - name: Install @theokit/sdk@latest (docs only)
        run: npm install --no-save --ignore-scripts @theokit/sdk@latest

      - name: Record the SDK version
        id: sdk
        run: echo "version=$(node -p "require('@theokit/sdk/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pin the devDependency to the synced SDK version
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.devDependencies=p.devDependencies||{};p.devDependencies['@theokit/sdk']='^${{ steps.sdk.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Sync references from the SDK scaffold
        run: node scripts/sync-references.mjs

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/sdk-references
          commit-message: "chore: sync references from @theokit/sdk@${{ steps.sdk.outputs.version }}"
          title: "chore: sync SDK references (@theokit/sdk@${{ steps.sdk.outputs.version }})"
          body: |
            Auto-generated by `sync-sdk-references`. Re-synced `skills/theokit-sdk/references/` from the `@theokit/sdk@${{ steps.sdk.outputs.version }}` scaffold and pinned the devDependency.

            The drift gate (`ci.yml`) validates this PR. If it fails on "SKILL.md links every reference", a **new module** appeared in the SDK scaffold — add its link + one-line description to `skills/theokit-sdk/SKILL.md`, then merge. On merge, bump the plugin version and publish.
          add-paths: |
            package.json
            skills/theokit-sdk/references
          delete-branch: true

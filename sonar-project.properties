# SonarQube Cloud analysis scope.
#
# Written by hand rather than generated: this repository has no `src/` and no vitest config. It is
# a Claude Code plugin — 31 skill definitions under `skills/`, and a small Node installer in `lib/`
# and `bin/`. The generator used for the sibling repositories refuses to guess here, which is the
# behaviour that keeps it from naming roots that do not exist.
#
# `skills/` is deliberately NOT a source root. Those are Markdown instruction files for an
# assistant, not code the scanner can reason about, and listing them would add 31 files that no
# rule applies to.

sonar.projectKey=usetheokit_theokit-skills
sonar.organization=usetheokit

sonar.sources=lib,bin
sonar.tests=tests
sonar.test.inclusions=**/*.test.mjs,**/*.test.js,**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,skills/**

sonar.sourceEncoding=UTF-8

# On `githubactions:S8543` — the workflow it described is gone.
#
# The rule ("JavaScript dependencies should be locked to verified versions") used to fire on the
# install line of `sdk-drift.yml`, which installed the taught `@theokit` packages at `@latest` on
# purpose. That workflow was removed with the corpus it policed. This note is kept so the exception
# is not re-added from memory if the rule fires again on something else.
#
# Two attempts were made to record the exception here, with `sonar.issue.ignore.multicriteria` —
# first with a literal path as resourceKey, then with an ant pattern. Both were pushed and both
# analyses left the issue OPEN. Measured, not assumed: SonarCloud automatic analysis reads only a
# subset of this file, and issue-ignore properties are not in it. The block was removed rather than
# left in place, because a control that looks like one and does nothing is worse than none — it is
# the fabricated-mechanism defect this project's rules exist to catch, committed in the file that
# configures the analyser.
#
# Resolving it properly is a human action in the SonarCloud UI (mark the issue Accepted, with the
# reason above). Until then the finding stands, open and visible, which is the honest state.
#
# What was NOT left to a comment: the companion finding `S6505` (lifecycle scripts running during
# that install) was a real, fixable exposure and was fixed — see the `--ignore-scripts` flag on the
# install line and the CHANGELOG entry under 0.5.0 § Security.

# SonarQube Cloud analysis scope.
#
# Written by hand rather than generated: this repository has no `src/` and no vitest config. It is
# a Claude Code plugin — 31 skill definitions under `skills/`, and a small Node installer in `lib/`
# and `bin/`. The generator used for the sibling repositories refuses to guess here, which is the
# behaviour that keeps it from naming roots that do not exist.
#
# `skills/` is deliberately NOT a source root. Those are Markdown instruction files for an
# assistant, not code the scanner can reason about, and listing them would add 31 files that no
# rule applies to.

sonar.projectKey=usetheokit_theokit-skills
sonar.organization=usetheokit

sonar.sources=lib,bin
sonar.tests=tests
sonar.test.inclusions=**/*.test.mjs,**/*.test.js,**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,skills/**

sonar.sourceEncoding=UTF-8

# One scoped rule exception, and the reason it is not a bypass.
#
# `githubactions:S8543` ("using dependencies without locking resolved versions is
# security-sensitive") fires on the install line of `sdk-drift.yml`. That line installs the taught
# `@theokit` packages at `@latest` on purpose: the job exists to ask whether the skills still
# resolve against what is published TODAY. Locking the versions would pin the very thing under
# test, and the job would pass forever while the skills drifted — it would keep its green check and
# lose its function, which is the failure mode this repository's gates are built to avoid.
#
# The rule is right about the risk and wrong about the remedy here. The remedy applied instead is
# `--ignore-scripts` on that install (S6505, fixed rather than excluded) plus the job's minimal
# `contents: read` / `issues: write` permissions.
#
# Scope is one rule on one file. Everything else the analyzer says about this workflow still counts.
sonar.issue.ignore.multicriteria=drift_latest
sonar.issue.ignore.multicriteria.drift_latest.ruleKey=githubactions:S8543
sonar.issue.ignore.multicriteria.drift_latest.resourceKey=.github/workflows/sdk-drift.yml
